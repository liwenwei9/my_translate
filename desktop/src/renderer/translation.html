<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Translation Result</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
      background: white;
      overflow: hidden;
    }

    #app {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .title-bar {
      background: #667eea;
      color: white;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: move;
      -webkit-app-region: drag;
    }

    .title-text {
      font-size: 12px;
      font-weight: 500;
    }

    .close-button {
      background: transparent;
      border: none;
      color: white;
      font-size: 18px;
      cursor: pointer;
      padding: 0 8px;
      line-height: 1;
      -webkit-app-region: no-drag;
    }

    .close-button:hover {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 12px;
      overflow-y: auto;
      gap: 12px;
    }

    .text-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .section-label {
      font-size: 12px;
      color: #999;
      font-weight: 500;
    }

    .text-content {
      font-size: 14px;
      line-height: 1.6;
      color: #333;
      padding: 10px;
      background: #f8f9fa;
      border-radius: 6px;
      border: 1px solid #e9ecef;
      max-height: 150px;
      overflow-y: auto;
    }

    .button-group {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    button {
      flex: 1;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 500;
    }

    .primary-button {
      background: #667eea;
      color: white;
    }

    .primary-button:hover {
      background: #5568d3;
    }

    .secondary-button {
      background: #f5f5f5;
      color: #333;
    }

    .secondary-button:hover {
      background: #e0e0e0;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #999;
    }

    .loading-spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .status {
      text-align: center;
      padding: 6px;
      font-size: 12px;
      border-radius: 4px;
      margin-top: 8px;
    }

    .status.success {
      background: #d4edda;
      color: #155724;
    }

    .status.error {
      background: #f8d7da;
      color: #721c24;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="title-bar">
      <div class="title-text">My Translate - 翻译结果</div>
      <button class="close-button" id="closeButton">×</button>
    </div>

    <div class="content">
      <div id="loadingArea" class="loading">
        <div class="loading-spinner"></div>
        <div>正在翻译...</div>
      </div>

      <div id="resultArea" style="display: none;">
        <div class="text-section">
          <div class="section-label">原文</div>
          <div class="text-content" id="sourceText"></div>
        </div>

        <div class="text-section">
          <div class="section-label">译文</div>
          <div class="text-content" id="translatedText"></div>
        </div>

        <div class="button-group">
          <button class="secondary-button" id="copySourceButton">复制原文</button>
          <button class="primary-button" id="copyButton">复制译文</button>
        </div>

        <div id="status"></div>
      </div>
    </div>
  </div>

  <script>
    const closeButton = document.getElementById('closeButton');
    const loadingArea = document.getElementById('loadingArea');
    const resultArea = document.getElementById('resultArea');
    const sourceTextDiv = document.getElementById('sourceText');
    const translatedTextDiv = document.getElementById('translatedText');
    const copyButton = document.getElementById('copyButton');
    const copySourceButton = document.getElementById('copySourceButton');
    const statusDiv = document.getElementById('status');

    let sourceText = '';
    let translatedText = '';

    // 显示状态
    function showStatus(message, type = 'success') {
      statusDiv.textContent = message;
      statusDiv.className = `status ${type}`;
      setTimeout(() => {
        statusDiv.textContent = '';
        statusDiv.className = 'status';
      }, 2000);
    }

    // 关闭窗口
    closeButton.addEventListener('click', () => {
      window.electronAPI.closeWindow();
    });

    // 复制译文
    copyButton.addEventListener('click', async () => {
      try {
        await window.electronAPI.copyToClipboard(translatedText);
        showStatus('已复制译文');
      } catch (error) {
        showStatus('复制失败', 'error');
      }
    });

    // 复制原文
    copySourceButton.addEventListener('click', async () => {
      try {
        await window.electronAPI.copyToClipboard(sourceText);
        showStatus('已复制原文');
      } catch (error) {
        showStatus('复制失败', 'error');
      }
    });

    // 接收并翻译文本
    window.electronAPI.onTranslationText(async (text) => {
      sourceText = text;
      sourceTextDiv.textContent = text;

      try {
        // 自动检测并切换语言
        const languages = await window.electronAPI.autoSwitchLanguages(text);
        
        // 执行翻译
        const result = await window.electronAPI.translate({
          text: text,
          sourceLanguage: languages.source,
          targetLanguage: languages.target
        });

        translatedText = result.text;
        translatedTextDiv.textContent = result.text;

        // 显示结果
        loadingArea.style.display = 'none';
        resultArea.style.display = 'block';
      } catch (error) {
        console.error('Translation failed:', error);
        translatedTextDiv.textContent = '翻译失败: ' + error.message;
        loadingArea.style.display = 'none';
        resultArea.style.display = 'block';
      }
    });

    // 清理监听器
    window.addEventListener('beforeunload', () => {
      window.electronAPI.removeTranslationTextListener();
    });
  </script>
</body>
</html>
